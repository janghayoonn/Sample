<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>편집 — 프로젝트 북 아카이브</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/edit">Project Archive · 편집</a>
    <nav>
      <a class="btn ghost" href="/">열람 모드로 보기</a>
      <button class="btn ghost" data-logout>로그아웃</button>
    </nav>
  </header>

  <main class="wrap">
    <h1 class="section-title">내 책</h1>
    <p class="section-sub">책을 눌러 내용을 편집하세요.</p>
    <div class="shelf" id="shelf"></div>
  </main>

  <dialog id="newDialog">
    <form id="newForm" method="dialog">
      <div class="dialog-head">
        <h2>새 책 만들기</h2>
        <button type="button" class="icon-btn" data-close aria-label="닫기">✕</button>
      </div>
      <div class="dialog-body">
        <div class="field">
          <label for="title">프로젝트명</label>
          <input type="text" id="title" name="title" required maxlength="120" placeholder="예: 2026 브랜드 리뉴얼">
        </div>
        <div class="field">
          <label for="description">설명</label>
          <textarea id="description" name="description" maxlength="2000" placeholder="이 프로젝트에 대한 짧은 소개"></textarea>
        </div>
        <div class="field">
          <span class="label">책표지</span>
          <div class="cover-picker" id="coverPicker" style="aspect-ratio:210/297">
            <div class="cover-placeholder">이미지 선택</div>
          </div>
          <input type="file" id="coverInput" accept="image/*" hidden>
          <span class="hint">표지는 나중에 바꿀 수도 있어요.</span>
        </div>
        <div class="field">
          <label for="preset">내지 규격</label>
          <select id="preset"></select>
          <div class="size-row" id="customSize" hidden>
            <input type="number" id="pageW" min="50" max="1000" value="210"> ×
            <input type="number" id="pageH" min="50" max="1000" value="297"> mm
          </div>
        </div>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn ghost" data-close>취소</button>
        <button type="submit" class="btn primary" id="createBtn">만들기</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { api, esc, coverHTML, PRESETS, toast } from '/common.js';

    const shelf = document.getElementById('shelf');
    const dialog = document.getElementById('newDialog');
    const form = document.getElementById('newForm');
    const preset = document.getElementById('preset');
    const pageW = document.getElementById('pageW');
    const pageH = document.getElementById('pageH');
    const coverInput = document.getElementById('coverInput');
    const coverPicker = document.getElementById('coverPicker');
    let coverFile = null;

    preset.innerHTML = PRESETS.map((p) => `<option value="${p.key}">${p.label}</option>`).join('');
    function syncSize() {
      const p = PRESETS.find((x) => x.key === preset.value);
      document.getElementById('customSize').hidden = p.key !== 'custom';
      if (p.w) { pageW.value = p.w; pageH.value = p.h; }
      coverPicker.style.aspectRatio = `${pageW.value} / ${pageH.value}`;
    }
    preset.onchange = syncSize;
    pageW.oninput = pageH.oninput = syncSize;

    coverPicker.onclick = () => coverInput.click();
    coverInput.onchange = () => {
      coverFile = coverInput.files[0] || null;
      if (coverFile) coverPicker.innerHTML = `<img src="${URL.createObjectURL(coverFile)}" alt="">`;
    };

    dialog.querySelectorAll('[data-close]').forEach((b) => (b.onclick = () => dialog.close()));

    form.onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('createBtn');
      btn.disabled = true; btn.textContent = '만드는 중…';
      const fd = new FormData();
      fd.append('title', document.getElementById('title').value);
      fd.append('description', document.getElementById('description').value);
      fd.append('pageW', pageW.value);
      fd.append('pageH', pageH.value);
      if (coverFile) fd.append('cover', coverFile);
      try {
        const book = await api('/api/books', { method: 'POST', body: fd });
        location.href = `/edit/${book.id}`;
      } catch (err) {
        toast(err.message);
        btn.disabled = false; btn.textContent = '만들기';
      }
    };

    async function load() {
      const books = await api('/api/books');
      shelf.innerHTML = `
        <a class="book-card new-card" href="#" id="newBtn">
          <div class="cover" style="aspect-ratio:210/297"><div><span>+</span>새 책 만들기</div></div>
          <div><h3>&nbsp;</h3><p>&nbsp;</p></div>
        </a>` +
        books.map((b) => `
          <a class="book-card" href="/edit/${b.id}">
            ${coverHTML(b)}
            <div><h3>${esc(b.title)}</h3><p>내지 ${b.pageCount}장</p></div>
          </a>`).join('');
      document.getElementById('newBtn').onclick = (e) => {
        e.preventDefault();
        form.reset(); coverFile = null;
        coverPicker.innerHTML = '<div class="cover-placeholder">이미지 선택</div>';
        syncSize();
        dialog.showModal();
      };
    }
    load();
  </script>
</body>
</html>
