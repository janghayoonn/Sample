<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프로젝트 북 아카이브</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    .viewer { margin: 0 var(--gutter); background: var(--stage); color: #f2f2f2; display: flex; flex-direction: column; }
    .viewer:fullscreen { margin: 0; }
    .stage {
      height: calc(100vh - 220px); min-height: 380px; overflow: auto; position: relative;
      display: flex; padding: 28px;
    }
    .viewer:fullscreen .stage { height: calc(100vh - 64px); }
    .spread { display: flex; margin: auto; }
    .spread .page { flex: none; box-shadow: 0 0 0 1px rgba(255,255,255,.04); }
    .controls {
      display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 16px;
      font-variant-numeric: tabular-nums; font-size: 1rem; font-weight: 500;
    }
    .controls .grp { display: flex; align-items: center; gap: 4px; }
    .controls .icon-btn { color: #f2f2f2; }
    .controls .icon-btn:hover { background: rgba(255,255,255,.12); }
    .controls .icon-btn:disabled { opacity: .3; pointer-events: none; }
    .counter { min-width: 104px; text-align: center; }
    .zoom-val { min-width: 60px; text-align: center; }

    .info { padding: 48px var(--gutter) 0; max-width: 820px; }
    .info h1 { font-size: 2rem; letter-spacing: -0.03em; margin: 0 0 12px; line-height: 1.25; }
    .info p { margin: 0; white-space: pre-wrap; font-size: 1.05rem; }

    .thumbs {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 48px 40px; padding: 56px var(--gutter) 96px; align-items: end;
    }
    .thumb { cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 12px; border: 0; background: none; padding: 0; }
    .thumb .spread { width: 100%; justify-content: center; }
    .thumb .page { box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 6px 18px rgba(0,0,0,.06); }
    .thumb.on .spread { outline: 2px solid var(--ink); outline-offset: 6px; }
    .thumb span { font-weight: 500; font-variant-numeric: tabular-nums; }
    .thumb:hover .page { opacity: .85; }

    @media (max-width: 720px) {
      .viewer { margin: 0; }
      .stage { height: 62vh; padding: 12px; }
      .thumbs { grid-template-columns: repeat(2, 1fr); gap: 28px 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Project Archive</a>
    <nav><a class="btn ghost" href="/">← 전체 보기</a></nav>
  </header>

  <div style="height:24px"></div>
  <section class="viewer" id="viewer">
    <div class="stage" id="stage"><div class="spread" id="spread"></div></div>
    <div class="controls">
      <div class="grp">
        <button class="icon-btn" id="prev" aria-label="이전">‹</button>
        <span class="counter" id="counter"></span>
        <button class="icon-btn" id="next" aria-label="다음">›</button>
      </div>
      <div class="grp">
        <button class="icon-btn" id="zoomOut" aria-label="축소">−</button>
        <span class="zoom-val" id="zoomVal">100%</span>
        <button class="icon-btn" id="zoomIn" aria-label="확대">+</button>
        <button class="icon-btn" id="full" aria-label="전체 화면">⛶</button>
      </div>
    </div>
  </section>

  <section class="info" id="info"></section>
  <section class="thumbs" id="thumbs"></section>

  <script type="module">
    import { api, esc, makePage, pad } from '/common.js';
    const $ = (s) => document.getElementById(s);
    const id = location.pathname.split('/').pop();

    let book;
    try { book = await api(`/api/books/${id}`); }
    catch (err) {
      document.body.innerHTML = `<p class="empty">${esc(err.message)}<br><br><a class="btn" href="/">전체 보기</a></p>`;
      throw err;
    }
    document.title = `${book.title} — 프로젝트 북 아카이브`;
    $('info').innerHTML = `<h1>${esc(book.title)}</h1>${book.description ? `<p class="muted">${esc(book.description)}</p>` : ''}`;

    // 펼침면(스프레드) 구성: 표지는 한 장, 이후 내지는 두 장씩
    const spreads = [];
    if (book.cover) spreads.push({ label: '표지', pages: [{ image: book.cover, fit: 'cover', scale: 1, x: 50, y: 50 }] });
    for (let i = 0; i < book.pages.length; i += 2) {
      const pair = book.pages.slice(i, i + 2);
      const label = pair.length === 2 ? `${pad(i + 1)}-${pad(i + 2)}` : pad(i + 1);
      spreads.push({ label, pages: pair });
    }
    const total = book.pages.length;

    let cur = 0, zoom = 1;
    const ZOOMS = [1, 1.25, 1.5, 2, 3];

    function layout() {
      const spread = $('spread');
      const s = spreads[cur];
      if (!s) return;
      const st = $('stage');
      const availW = st.clientWidth - 56, availH = st.clientHeight - 56;
      const { w, h } = book.pageSize;
      const n = s.pages.length;
      // 두 쪽 펼침 기준으로 크기를 맞춰 표지/홀수 페이지도 같은 크기로 보이게
      const slots = Math.max(n, spreads.length > 1 || total > 1 ? 2 : 1);
      let ph = availH, pw = ph * (w / h);
      if (pw * slots > availW) { pw = availW / slots; ph = pw * (h / w); }
      pw *= zoom; ph *= zoom;
      spread.querySelectorAll('.page').forEach((el) => { el.style.width = `${pw}px`; el.style.height = `${ph}px`; });
    }

    function show(i) {
      if (!spreads.length) {
        $('spread').innerHTML = '<p class="muted" style="color:#aaa">아직 내지가 없습니다.</p>';
        $('counter').textContent = '0 / 0';
        $('prev').disabled = $('next').disabled = true;
        return;
      }
      cur = Math.max(0, Math.min(spreads.length - 1, i));
      const s = spreads[cur];
      $('spread').replaceChildren(...s.pages.map((p) => makePage(p, book.pageSize, { lazy: false })));
      $('counter').textContent = `${s.label} / ${pad(total)}`;
      $('prev').disabled = cur === 0;
      $('next').disabled = cur === spreads.length - 1;
      document.querySelectorAll('.thumb').forEach((t, j) => t.classList.toggle('on', j === cur));
      layout();
      // 다음 장 이미지를 미리 불러오기
      spreads[cur + 1]?.pages.forEach((p) => { new Image().src = `/uploads/${encodeURIComponent(p.image)}`; });
    }

    function setZoom(z) {
      zoom = z;
      $('zoomVal').textContent = `${Math.round(z * 100)}%`;
      $('zoomOut').disabled = z === ZOOMS[0];
      $('zoomIn').disabled = z === ZOOMS.at(-1);
      layout();
    }

    $('prev').onclick = () => show(cur - 1);
    $('next').onclick = () => show(cur + 1);
    $('zoomIn').onclick = () => setZoom(ZOOMS[Math.min(ZOOMS.length - 1, ZOOMS.indexOf(zoom) + 1)]);
    $('zoomOut').onclick = () => setZoom(ZOOMS[Math.max(0, ZOOMS.indexOf(zoom) - 1)]);
    $('full').onclick = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else $('viewer').requestFullscreen?.();
    };
    document.addEventListener('fullscreenchange', layout);
    window.addEventListener('resize', layout);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') show(cur + 1);
      if (e.key === 'ArrowLeft') show(cur - 1);
    });

    // 축소판 목록
    $('thumbs').innerHTML = '';
    spreads.forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'thumb';
      const sp = document.createElement('div');
      sp.className = 'spread';
      const width = 100 / Math.max(2, s.pages.length);
      s.pages.forEach((p) => { const pg = makePage(p, book.pageSize); pg.style.width = `${width}%`; sp.append(pg); });
      const label = document.createElement('span');
      label.textContent = s.label;
      b.append(sp, label);
      b.onclick = () => { show(i); $('viewer').scrollIntoView({ behavior: 'smooth' }); };
      $('thumbs').append(b);
    });

    setZoom(1);
    show(0);
  </script>
</body>
</html>
