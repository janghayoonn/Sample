<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프로젝트 북 아카이브</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Project Archive</a>
  </header>
  <main class="wrap">
    <div class="shelf" id="shelf"></div>
  </main>
  <script type="module">
    import { api, esc, coverHTML } from '/common.js';
    const shelf = document.getElementById('shelf');

    // 새 책 만들기: 누르면 편집 비밀번호 화면 → 로그인 후 '새 책 만들기' 창이 바로 열림
    const newCard = `
      <a class="book-card new-card" href="/edit?new=1">
        <div class="cover" style="aspect-ratio:148/210"><div><span>+</span>신규 책장 만들기</div></div>
        <div><h3>&nbsp;</h3><p>&nbsp;</p></div>
      </a>`;

    let books = [];
    try { books = await api('/api/books'); } catch { /* 불러오지 못해도 버튼은 보여줌 */ }

    shelf.innerHTML = newCard + books.map((b) => `
      <a class="book-card" href="/b/${b.id}">
        ${coverHTML(b)}
        <div>
          <h3>${esc(b.title)}</h3>
          <p>${new Date(b.createdAt).getFullYear()} · ${b.pageCount}p</p>
        </div>
      </a>`).join('');
  </script>
</body>
</html>
