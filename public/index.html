<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프로젝트 북 아카이브</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Project Archive</a>
  </header>
  <main class="wrap">
    <div class="shelf" id="shelf"></div>
  </main>
  <script type="module">
    import { api, esc, coverHTML } from '/common.js';
    const books = await api('/api/books');
    const shelf = document.getElementById('shelf');
    if (!books.length) {
      shelf.outerHTML = '<p class="empty">아직 공개된 책이 없습니다.</p>';
    } else {
      shelf.innerHTML = books.map((b) => `
        <a class="book-card" href="/b/${b.id}">
          ${coverHTML(b)}
          <div>
            <h3>${esc(b.title)}</h3>
            <p>${new Date(b.createdAt).getFullYear()} · ${b.pageCount}p</p>
          </div>
        </a>`).join('');
    }
  </script>
</body>
</html>
